const $=id=>document.getElementById(id);
const nik=$("nik"), btn=$("btn"), res=$("result");
async function hashNik(v){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(v),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(SALT),iterations:ITER,hash:"SHA-256"},key,256);
  return Array.from(new Uint8Array(bits),b=>b.toString(16).padStart(2,"0")).join("").slice(0,LEN);
}
nik.addEventListener("input",()=>{
  nik.value=nik.value.replace(/\D/g,"").slice(0,16);
  $("n").textContent=nik.value.length;
  btn.disabled=nik.value.length!==16;
  res.className="";res.textContent="";
});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(nik.value.length!==16)return;
  btn.disabled=true;btn.textContent="Memeriksa…";
  try{
