    res.className=found?"ok":"no";
    res.innerHTML=found
      ?"✓ Anda sudah terdaftar dalam DPT."
      :"✗ NIK tidak ditemukan. Anda belum terdaftar dalam DPT.<small>Periksa kembali NIK yang dimasukkan, atau hubungi panitia.</small>";
  }catch(err){
    res.className="no";res.textContent="Pengecekan gagal. Gunakan browser terbaru dan buka halaman lewat https.";
  }
  btn.textContent="Cek Status";btn.disabled=nik.value.length!==16;
});
</script>
